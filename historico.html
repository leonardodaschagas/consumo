<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico & Auditoria de Fatura - Gestão Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #9333ea;
            --accent: #10b981;
            --warning: #fbbf24;
            --danger: #ef4444;
            --real: #38bdf8;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            display: flex;
            color: white;
            overflow: hidden;
        }

        /* BARRA LATERAL */
        .sidebar {
            width: 280px;
            min-width: 280px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            height: 100vh;
        }

        .sidebar h2 { margin-bottom: 40px; text-align: center; color: var(--accent); font-size: 1.5rem; }

        .menu-item {
            padding: 14px 18px;
            margin-bottom: 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            color: rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .menu-item:hover, .menu-item.active { background: rgba(255,255,255,0.1); color: white; }
        .menu-item.active { border-left: 4px solid var(--accent); background: rgba(16, 185, 129, 0.1); }

        .main-content { 
            flex: 1; 
            padding: 40px; 
            overflow-y: auto; 
            height: 100vh;
            background: rgba(0,0,0,0.2); 
        }

        .main-content::-webkit-scrollbar { width: 8px; }
        .main-content::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        .main-content::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        .card { 
            background: var(--glass); 
            padding: 25px; 
            border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.1); 
            margin-bottom: 25px; 
        }

        .inputs-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        input {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            color: white;
            outline: none
